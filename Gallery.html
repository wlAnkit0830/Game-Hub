<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Games | Game Hub Hoshiarpur</title>
<style>
  :root{
    --bg:#07080f;
    --bg2:#0d0f1a;
    --neon-pink:#ff2e9a;
    --neon-blue:#00e5ff;
    --neon-purple:#8a2eff;
    --text:#e8e8f5;
    --muted:#9a9ab0;
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  body{
    background:radial-gradient(circle at 20% 10%, #14172b 0%, var(--bg) 55%);
    color:var(--text);
    font-family:'Segoe UI', Arial, sans-serif;
    min-height:100vh;
  }

  header{
    text-align:center;
    padding:60px 20px 30px;
  }

  header h1{
    font-size:2.6rem;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#fff;
    text-shadow:
      0 0 8px var(--neon-blue),
      0 0 20px var(--neon-blue),
      0 0 40px var(--neon-purple);
  }

  header p{
    margin-top:12px;
    color:var(--muted);
    font-size:1.05rem;
  }

  nav{
    display:flex;
    justify-content:center;
    gap:28px;
    padding:10px 0 40px;
    flex-wrap:wrap;
  }

  nav a{
    color:var(--text);
    text-decoration:none;
    font-size:0.95rem;
    letter-spacing:1px;
    text-transform:uppercase;
    padding:8px 18px;
    border:1px solid rgba(0,229,255,0.3);
    border-radius:30px;
    transition:all 0.25s ease;
  }

  nav a:hover, nav a.active{
    color:#000;
    background:var(--neon-blue);
    box-shadow:0 0 15px var(--neon-blue), 0 0 30px var(--neon-blue);
  }

  .games-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
    gap:24px;
    max-width:1300px;
    margin:0 auto;
    padding:0 30px 80px;
  }

  .game-card{
    position:relative;
    background:var(--bg2);
    border-radius:14px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.06);
    box-shadow:0 4px 20px rgba(0,0,0,0.5);
    transition:transform 0.3s ease, box-shadow 0.3s ease;
    cursor:pointer;
  }

  .game-card:hover{
    transform:translateY(-6px);
    box-shadow:
      0 0 20px var(--neon-pink),
      0 0 40px rgba(138,46,255,0.4);
  }

  .game-card .img-wrap{
    width:100%;
    aspect-ratio:4/3;
    overflow:hidden;
  }

  .game-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform 0.4s ease;
  }

  .game-card:hover img{
    transform:scale(1.08);
  }

  /* Lightbox */
  .lightbox{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(3,3,8,0.92);
    z-index:999;
    align-items:center;
    justify-content:center;
    padding:30px;
  }

  .lightbox.open{ display:flex; }

  .lightbox img{
    max-width:90vw;
    max-height:85vh;
    border-radius:10px;
    box-shadow:0 0 40px var(--neon-blue);
  }

  .lightbox .close-btn{
    position:absolute;
    top:24px;
    right:34px;
    font-size:2.2rem;
    color:#fff;
    cursor:pointer;
    text-shadow:0 0 10px var(--neon-pink);
  }

  footer{
    text-align:center;
    padding:30px 20px 50px;
    color:var(--muted);
    font-size:0.85rem;
  }

  @media (max-width:480px){
    header h1{font-size:1.9rem;}
  }
</style>
</head>
<body>

<header>
  <h1>Our Arcade Games</h1>
  <p>Take a look at what's waiting for you at Game Hub Hoshiarpur</p>
</header>

<nav>
  <a href="index.html">Home</a>
  <a href="Games.html" class="active">Games</a>
  <a href="Gallery.html">Gallery</a>
  <a href="Kids.html">Kids Zone</a>
  <a href="HallOfFame.html">Hall of Fame</a>
</nav>

<section class="games-grid">
  <div class="game-card" onclick="openLightbox('1.jpeg')"><div class="img-wrap"><img src="1.jpeg" alt="Arcade game" loading="lazy"></div></div>
  <div class="game-card" onclick="openLightbox('2.jpeg')"><div class="img-wrap"><img src="2.jpeg" alt="Arcade game" loading="lazy"></div></div>
  <div class="game-card" onclick="openLightbox('3.jpeg')"><div class="img-wrap"><img src="3.jpeg" alt="Arcade game" loading="lazy"></div></div>
  <div class="game-card" onclick="openLightbox('4.jpeg')"><div class="img-wrap"><img src="4.jpeg" alt="Arcade game" loading="lazy"></div></div>
  <div class="game-card" onclick="openLightbox('5.jpeg')"><div class="img-wrap"><img src="5.jpeg" alt="Arcade game" loading="lazy"></div></div>
  <div class="game-card" onclick="openLightbox('6.jpeg')"><div class="img-wrap"><img src="6.jpeg" alt="Arcade game" loading="lazy"></div></div>
  <div class="game-card" onclick="openLightbox('7.jpeg')"><div class="img-wrap"><img src="7.jpeg" alt="Arcade game" loading="lazy"></div></div>
  <div class="game-card" onclick="openLightbox('8.jpeg')"><div class="img-wrap"><img src="8.jpeg" alt="Arcade game" loading="lazy"></div></div>
  <div class="game-card" onclick="openLightbox('9.jpeg')"><div class="img-wrap"><img src="9.jpeg" alt="Arcade game" loading="lazy"></div></div>
  <div class="game-card" onclick="openLightbox('10.jpeg')"><div class="img-wrap"><img src="10.jpeg" alt="Arcade game" loading="lazy"></div></div>
  <div class="game-card" onclick="openLightbox('11.jpeg')"><div class="img-wrap"><img src="11.jpeg" alt="Arcade game" loading="lazy"></div></div>
  <div class="game-card" onclick="openLightbox('12.jpeg')"><div class="img-wrap"><img src="12.jpeg" alt="Arcade game" loading="lazy"></div></div>
  <div class="game-card" onclick="openLightbox('13.jpeg')"><div class="img-wrap"><img src="13.jpeg" alt="Arcade game" loading="lazy"></div></div>
  <div class="game-card" onclick="openLightbox('14.jpeg')"><div class="img-wrap"><img src="14.jpeg" alt="Arcade game" loading="lazy"></div></div>
  <div class="game-card" onclick="openLightbox('15.jpeg')"><div class="img-wrap"><img src="15.jpeg" alt="Arcade game" loading="lazy"></div></div>
  <div class="game-card" onclick="openLightbox('16.jpeg')"><div class="img-wrap"><img src="16.jpeg" alt="Arcade game" loading="lazy"></div></div>
</section>

<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <span class="close-btn" onclick="closeLightbox(event)">&times;</span>
  <img id="lightbox-img" src="" alt="Enlarged game photo">
</div>

<footer>
  &copy; <span id="year"></span> Game Hub Hoshiarpur. All rights reserved.
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  function openLightbox(src){
    const lb = document.getElementById('lightbox');
    const img = document.getElementById('lightbox-img');
    img.src = src;
    lb.classList.add('open');
  }

  function closeLightbox(e){
    document.getElementById('lightbox').classList.remove('open');
  }

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeLightbox();
  });
</script>

</body>
</html>
